<!DOCTYPE html>
<html>
<head>
    <title>Temples and Pilgrimages of India</title>
    <link rel="stylesheet" href="delhi.css">
    <style>
        /* Reset body */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fdf6f0;
            color: #333;
            text-align: center;
        }

        h1.case {
            font-size: 2.5em;
            margin-top: 30px;
            text-decoration: underline;
            text-underline-offset: 6px;
            color: #4a2f0b;
        }

        /* Reel container */
        .reel-container {
            width: 80%;          /* smaller width */
            max-width: 700px;    /* max width */
            height: 250px;       /* reduced height */
            margin: 30px auto;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            position: relative;
        }

        /* Reel track */
        .reel-track {
            display: flex;
            width: calc(700px * 5); /* total width = image count * container width */
            animation: slide 100s linear infinite; /* slower speed */
        }

        .reel-track img {
            width: 700px;      /* match container width */
            height: 250px;     /* match container height */
            object-fit: cover;
            flex-shrink: 0;
            transition: transform 0.3s;
        }

        .reel-track img:hover {
            transform: scale(1.05);
            cursor: pointer;
        }

        /* Animation keyframes */
        @keyframes slide {
            0% { transform: translateX(0); }
            20% { transform: translateX(-700px); }
            40% { transform: translateX(-1400px); }
            60% { transform: translateX(-2100px); }
            80% { transform: translateX(-2800px); }
            100% { transform: translateX(0); }
        }

        /* State links buttons */
        .state-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 40px 0;
            gap: 15px;
        }

        .state-links a {
            text-decoration: none;
        }

        .state-links p {
            background-color: #ff7f50;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            margin: 0;
            transition: 0.3s;
        }

        .state-links p:hover {
            background-color: #ff5722;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            cursor: pointer;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .reel-container {
                height: 180px;
            }
            .reel-track img {
                height: 180px;
                width: 100%;
            }
            h1.case {
                font-size: 2em;
            }
            .state-links p {
                padding: 10px 18px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
